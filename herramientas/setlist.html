<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setlist — Jorge Malgesto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/system.css">

  <style>
    /* ── Layout ───────────────────────────────────────────── */
    body { overflow-x: hidden; }

    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: var(--sp-5);
      padding-bottom: var(--sp-8);
      min-height: 100dvh;
    }

    .tool-header {
      padding: var(--sp-6) 0 var(--sp-4);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--sp-4);
    }
    .tool-header__left { display: flex; flex-direction: column; gap: var(--sp-3); }
    .tool-header__title {
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--color-text-dim);
    }

    /* ── Tabs ─────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 0;
      border: var(--border-thin);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: var(--sp-5);
    }
    .tab-btn {
      flex: 1;
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--color-text-dim);
      background: transparent;
      border: none;
      padding: var(--sp-3) var(--sp-4);
      cursor: pointer;
      transition: all 150ms ease-out;
    }
    .tab-btn.active {
      background: var(--color-bg-soft);
      color: var(--color-text-soft);
    }
    .tab-btn:not(:last-child) { border-right: var(--border-thin); }

    /* ── Vistas ───────────────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Lista de setlists ────────────────────────────────── */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--sp-4);
    }
    .list-title {
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--color-text-dim);
    }

    .item-card {
      border-top: var(--border-thin);
      padding: var(--sp-4) 0;
      cursor: pointer;
      transition: color 150ms ease-out;
    }
    .item-card:last-child { border-bottom: var(--border-thin); }
    .item-card:hover .item-card__title { color: var(--color-accent); }

    .item-card__title {
      font-family: var(--font-serif);
      font-size: var(--fs-h3);
      font-weight: 500;
      color: var(--color-text);
      line-height: 1.3;
      margin-bottom: var(--sp-1);
      transition: color 150ms ease-out;
    }
    .item-card__meta {
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      color: var(--color-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .item-card__actions {
      display: flex;
      gap: var(--sp-3);
      margin-top: var(--sp-3);
    }
    .action-btn {
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-dim);
      background: transparent;
      border: var(--border-thin);
      border-radius: var(--radius-sm);
      padding: var(--sp-1) var(--sp-3);
      cursor: pointer;
      transition: all 150ms ease-out;
    }
    .action-btn:hover { color: var(--color-text-soft); border-color: var(--color-border-soft); }
    .action-btn--danger:hover { color: var(--color-accent); border-color: var(--color-accent); }

    .empty-state {
      text-align: center;
      padding: var(--sp-8) 0;
      font-family: var(--font-serif);
      font-size: var(--fs-body);
      font-style: italic;
      color: var(--color-text-faint);
    }

    /* ── Formulario (modal / inline) ──────────────────────── */
    .form-panel {
      background: var(--color-bg-card);
      border: var(--border-thin);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
      margin-bottom: var(--sp-5);
      display: none;
    }
    .form-panel.open { display: block; }

    .form-title {
      font-family: var(--font-serif);
      font-size: var(--fs-h3);
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: var(--sp-5);
    }

    .field { margin-bottom: var(--sp-4); }
    .field-label {
      display: block;
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--color-text-dim);
      margin-bottom: var(--sp-2);
    }
    .field-input {
      width: 100%;
      background: var(--color-bg);
      border: var(--border-thin);
      border-radius: var(--radius-md);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-size: var(--fs-body-sans);
      padding: var(--sp-3) var(--sp-4);
      transition: border-color 150ms ease-out;
    }
    .field-input:focus { outline: none; border-color: var(--color-border-soft); }
    .field-input::placeholder { color: var(--color-text-faint); }

    .field-row { display: flex; gap: var(--sp-3); }
    .field-row .field { flex: 1; }

    .field-textarea {
      resize: vertical;
      min-height: 80px;
      font-family: var(--font-sans);
      font-size: var(--fs-body-sans);
    }

    /* Selector de proyecto en el form */
    .project-pills-form {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
    }
    .project-pill-form {
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: var(--sp-1) var(--sp-3);
      border-radius: var(--radius-pill);
      border: 0.5px solid var(--color-border);
      background: transparent;
      color: var(--color-text-mute);
      cursor: pointer;
      transition: all 150ms ease-out;
      user-select: none;
    }
    .project-pill-form.active {
      background: var(--color-accent-soft);
      color: var(--color-accent);
      border-color: var(--color-accent);
    }

    /* Tap tempo */
    .tap-row {
      display: flex;
      gap: var(--sp-3);
      align-items: flex-end;
    }
    .tap-row .field { flex: 1; }
    .tap-btn {
      flex-shrink: 0;
      padding: var(--sp-3) var(--sp-4);
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: var(--color-bg-soft);
      border: var(--border-thin);
      border-radius: var(--radius-md);
      color: var(--color-text-soft);
      cursor: pointer;
      transition: all 150ms ease-out;
      margin-bottom: var(--sp-4);
    }
    .tap-btn:active { background: var(--color-bg-card); }

    /* Estructura / secciones */
    .structure-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      margin-bottom: var(--sp-3);
    }
    .structure-item {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .structure-item .field-input { flex: 1; padding: var(--sp-2) var(--sp-3); font-size: var(--fs-small); }
    .structure-item .field-input.dur { width: 72px; flex: none; }
    .remove-btn {
      background: transparent;
      border: none;
      color: var(--color-text-faint);
      cursor: pointer;
      font-size: 16px;
      padding: 0 var(--sp-1);
      line-height: 1;
      transition: color 150ms ease-out;
      flex-shrink: 0;
    }
    .remove-btn:hover { color: var(--color-accent); }

    .form-actions {
      display: flex;
      gap: var(--sp-3);
      margin-top: var(--sp-5);
      flex-wrap: wrap;
    }

    /* ── Detalle de setlist ────────────────────────────────── */
    .detail-header {
      display: flex;
      align-items: baseline;
      gap: var(--sp-3);
      margin-bottom: var(--sp-5);
      flex-wrap: wrap;
    }
    .detail-title {
      font-family: var(--font-serif);
      font-size: var(--fs-h2);
      font-weight: 500;
      color: var(--color-text);
      flex: 1;
    }

    .song-row {
      border-top: var(--border-thin);
      padding: var(--sp-3) 0;
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      cursor: pointer;
    }
    .song-row:last-of-type { border-bottom: var(--border-thin); }
    .song-row__num {
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      color: var(--color-text-faint);
      flex-shrink: 0;
      width: 20px;
    }
    .song-row__info { flex: 1; }
    .song-row__title {
      font-family: var(--font-serif);
      font-size: var(--fs-body);
      font-weight: 500;
      color: var(--color-text);
    }
    .song-row__meta {
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      color: var(--color-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 2px;
    }
    .song-row__remove {
      background: transparent;
      border: none;
      color: var(--color-text-faint);
      cursor: pointer;
      font-size: 14px;
      padding: var(--sp-1);
      transition: color 150ms ease-out;
    }
    .song-row__remove:hover { color: var(--color-accent); }

    .show-btn-wrap { margin-top: var(--sp-6); }

    /* ── Modo show ────────────────────────────────────────── */
    #show-mode {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--color-bg);
      z-index: 100;
      flex-direction: column;
      padding: var(--sp-4) var(--sp-5);
      overflow-y: auto;
      touch-action: pan-y;
    }
    #show-mode.open { display: flex; }

    .show-top {
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--color-text-dim);
      margin-bottom: var(--sp-5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .show-exit-btn {
      background: transparent;
      border: var(--border-thin);
      border-radius: var(--radius-sm);
      color: var(--color-text-faint);
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: var(--sp-1) var(--sp-3);
      cursor: pointer;
    }

    .show-divider { width: 100%; height: 0.5px; background: var(--color-border); margin: var(--sp-4) 0; }

    .show-song-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 7vw, 44px);
      font-weight: 500;
      color: var(--color-text);
      line-height: 1.15;
      margin-bottom: var(--sp-2);
    }
    .show-song-artist {
      font-family: var(--font-serif);
      font-size: var(--fs-body);
      font-style: italic;
      color: var(--color-text-mute);
    }

    .show-meta-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: var(--sp-1) var(--sp-5);
      align-items: baseline;
    }
    .show-meta-key {
      font-family: var(--font-serif);
      font-size: clamp(32px, 8vw, 52px);
      font-weight: 500;
      font-style: italic;
      color: var(--color-accent);
      grid-column: 1;
      grid-row: 1 / 4;
      align-self: center;
      line-height: 1;
    }
    .show-meta-label {
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--color-text-dim);
    }
    .show-meta-value {
      font-family: var(--font-mono);
      font-size: var(--fs-mono);
      color: var(--color-text-soft);
    }

    .show-structure-title {
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--color-text-dim);
      margin-bottom: var(--sp-3);
    }
    .show-structure-item {
      display: flex;
      justify-content: space-between;
      padding: var(--sp-2) 0;
      border-top: var(--border-thin);
      font-family: var(--font-mono);
      font-size: var(--fs-mono);
      color: var(--color-text-soft);
    }
    .show-structure-item:last-child { border-bottom: var(--border-thin); }

    .show-notes {
      font-family: var(--font-serif);
      font-size: var(--fs-body);
      font-style: italic;
      color: var(--color-text-soft);
      line-height: 1.7;
    }

    .show-nav {
      margin-top: auto;
      padding-top: var(--sp-5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .show-nav-btn {
      font-family: var(--font-mono);
      font-size: var(--fs-mono-sm);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--color-text-dim);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: var(--sp-3) 0;
      transition: color 150ms ease-out;
    }
    .show-nav-btn:hover { color: var(--color-text-soft); }
    .show-nav-btn:disabled { opacity: 0.2; cursor: default; }

    /* ── Import/Export ───────────────────────────────────── */
    .io-row {
      display: flex;
      gap: var(--sp-3);
      margin-top: var(--sp-5);
      padding-top: var(--sp-5);
      border-top: var(--border-thin);
    }

    @media (min-width: 768px) {
      .page { padding: var(--sp-7) var(--sp-7) var(--sp-8); }
    }
  </style>
</head>
<body>
<div class="page">

  <header class="tool-header">
    <div class="tool-header__left">
      <a href="../herramientas/" class="return-link">← Herramientas</a>
      <span class="tool-header__title">Setlist</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="setlists">Setlists</button>
    <button class="tab-btn" data-tab="songs">Canciones</button>
  </div>

  <!-- ── Vista: Setlists ─────────────────────────────────── -->
  <div class="view active" id="view-setlists">

    <div class="list-header">
      <span class="list-title">Tus setlists</span>
      <button class="btn btn--ghost" id="btn-new-setlist" style="font-size:12px;padding:8px 16px;">+ Nuevo</button>
    </div>

    <!-- Form nuevo/editar setlist -->
    <div class="form-panel" id="form-setlist">
      <p class="form-title" id="form-setlist-title">Nuevo setlist</p>
      <div class="field">
        <label class="field-label">Nombre</label>
        <input class="field-input" id="sl-name" type="text" placeholder="Foro Indie · 2026-03-15">
      </div>
      <div class="field">
        <label class="field-label">Proyecto</label>
        <div class="project-pills-form" id="sl-project-pills">
          <button class="project-pill-form" data-val="davis-don">Davis Don</button>
          <button class="project-pill-form" data-val="leocadio">Leocadio</button>
          <button class="project-pill-form" data-val="juana">Juana</button>
          <button class="project-pill-form active" data-val="">Ninguno</button>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn--primary" id="btn-save-setlist">Guardar</button>
        <button class="btn btn--ghost" id="btn-cancel-setlist">Cancelar</button>
      </div>
    </div>

    <div id="setlists-list"></div>

    <div class="io-row">
      <button class="btn btn--ghost" id="btn-export" style="font-size:11px;padding:8px 16px;">Exportar</button>
      <label class="btn btn--ghost" style="font-size:11px;padding:8px 16px;cursor:pointer;">
        Importar
        <input type="file" accept=".json" id="btn-import" style="display:none">
      </label>
    </div>
  </div>

  <!-- ── Vista: Canciones ─────────────────────────────────── -->
  <div class="view" id="view-songs">

    <div class="list-header">
      <span class="list-title">Biblioteca</span>
      <button class="btn btn--ghost" id="btn-new-song" style="font-size:12px;padding:8px 16px;">+ Canción</button>
    </div>

    <!-- Form canción -->
    <div class="form-panel" id="form-song">
      <p class="form-title" id="form-song-title">Nueva canción</p>
      <div class="field">
        <label class="field-label">Título</label>
        <input class="field-input" id="s-title" type="text" placeholder="Nombre de la canción">
      </div>
      <div class="field">
        <label class="field-label">Artista / Proyecto</label>
        <input class="field-input" id="s-artist" type="text" placeholder="Davis Don, original">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Tonalidad</label>
          <input class="field-input" id="s-key" type="text" placeholder="Em">
        </div>
        <div class="field">
          <label class="field-label">Compás</label>
          <input class="field-input" id="s-timesig" type="text" placeholder="4/4">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Tempo (BPM)</label>
        <div class="tap-row">
          <div class="field" style="margin:0">
            <input class="field-input" id="s-tempo" type="number" placeholder="120" min="30" max="300">
          </div>
          <button class="tap-btn" id="tap-btn">TAP</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Estructura</label>
        <div class="structure-list" id="structure-list"></div>
        <button class="btn btn--ghost" id="btn-add-section" style="font-size:11px;padding:6px 14px;">+ Sección</button>
      </div>
      <div class="field">
        <label class="field-label">Notas <span style="font-size:9px;letter-spacing:0">(usa *palabra* para acento)</span></label>
        <textarea class="field-input field-textarea" id="s-notes" placeholder="Slide al Em en el último chorus..."></textarea>
      </div>
      <div class="field">
        <label class="field-label">Proyecto</label>
        <div class="project-pills-form" id="s-project-pills">
          <button class="project-pill-form" data-val="davis-don">Davis Don</button>
          <button class="project-pill-form" data-val="leocadio">Leocadio</button>
          <button class="project-pill-form" data-val="juana">Juana</button>
          <button class="project-pill-form active" data-val="">Ninguno</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Link (opcional)</label>
        <input class="field-input" id="s-link" type="url" placeholder="https://...">
      </div>
      <div class="form-actions">
        <button class="btn btn--primary" id="btn-save-song">Guardar</button>
        <button class="btn btn--ghost" id="btn-cancel-song">Cancelar</button>
      </div>
    </div>

    <div id="songs-list"></div>
  </div>

  <!-- ── Vista: Detalle de setlist ──────────────────────── -->
  <div class="view" id="view-detail">
    <button class="return-link" id="btn-back-setlists" style="margin-bottom:var(--sp-5)">← Setlists</button>
    <div class="detail-header">
      <h2 class="detail-title" id="detail-title">Setlist</h2>
      <button class="action-btn" id="btn-edit-setlist-name">Editar</button>
    </div>
    <div id="detail-songs-list"></div>
    <div style="margin-top:var(--sp-5)">
      <p class="list-title" style="margin-bottom:var(--sp-3)">Agregar canción</p>
      <div id="detail-add-songs"></div>
    </div>
    <div class="show-btn-wrap">
      <button class="btn btn--primary" id="btn-start-show">Iniciar show →</button>
    </div>
  </div>

</div>

<!-- ── Modo show ─────────────────────────────────────────── -->
<div id="show-mode">
  <div class="show-top">
    <span id="show-counter"></span>
    <button class="show-exit-btn" id="btn-exit-show">Salir</button>
  </div>

  <h2 class="show-song-title" id="show-title"></h2>
  <p class="show-song-artist" id="show-artist"></p>

  <div class="show-divider"></div>

  <div class="show-meta-grid" id="show-meta"></div>

  <div class="show-divider"></div>

  <p class="show-structure-title">Estructura</p>
  <div id="show-structure"></div>

  <div class="show-divider"></div>

  <p class="show-notes" id="show-notes"></p>

  <div class="show-divider"></div>

  <nav class="show-nav">
    <button class="show-nav-btn" id="btn-prev">← anterior</button>
    <button class="show-nav-btn" id="btn-next">siguiente →</button>
  </nav>
</div>

<script type="module">
import SetlistStore from '../js/setlist-store.js';
import { generateId, formatTime, parseAccentText, timeAgo } from '../js/shared.js';

/* ── Init ───────────────────────────────────────────────── */
await SetlistStore.init();

/* ── Estado global ──────────────────────────────────────── */
let currentSetlistId = null;
let editingSongId    = null;
let editingSetlistId = null;
let showSongs        = [];
let showIdx          = 0;
let wakeLock         = null;
let tapTimes         = [];
let structureSections = [];

/* ── Helpers ────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const showView = name => {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $(`view-${name}`).classList.add('active');
};

function projectLabel(tag) {
  const map = { 'davis-don': 'Davis Don', 'leocadio': 'Leocadio', 'juana': 'Juana' };
  return map[tag] || '';
}

/* ── Tabs ────────────────────────────────────────────────── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    showView(btn.dataset.tab);
    if (btn.dataset.tab === 'setlists') renderSetlists();
    if (btn.dataset.tab === 'songs')    renderSongs();
  });
});

/* ══ SETLISTS ═══════════════════════════════════════════════ */

async function renderSetlists() {
  const list = await SetlistStore.getAllSetlists();
  const allSongs = await SetlistStore.getAllSongs();
  const container = $('setlists-list');

  if (!list.length) {
    container.innerHTML = '<p class="empty-state">No hay setlists todavía.</p>';
    return;
  }

  container.innerHTML = list.map(sl => {
    const count    = sl.songIds?.length || 0;
    const totalSec = (sl.songIds || []).reduce((acc, id) => {
      const s = allSongs.find(x => x.id === id);
      return acc + (s?.duration || 0);
    }, 0);
    const meta = [
      count ? `${count} canción${count !== 1 ? 'es' : ''}` : 'Sin canciones',
      totalSec ? formatTime(totalSec) : null,
      sl.projectTag ? projectLabel(sl.projectTag) : null,
      timeAgo(sl.updatedAt),
    ].filter(Boolean).join(' · ');

    return `
      <div class="item-card" data-id="${sl.id}">
        <div class="item-card__title">${sl.name}</div>
        <div class="item-card__meta">${meta}</div>
        <div class="item-card__actions">
          <button class="action-btn btn-open-setlist" data-id="${sl.id}">Abrir</button>
          <button class="action-btn btn-show-setlist" data-id="${sl.id}">Show</button>
          <button class="action-btn action-btn--danger btn-del-setlist" data-id="${sl.id}">Eliminar</button>
        </div>
      </div>`;
  }).join('');

  container.querySelectorAll('.btn-open-setlist').forEach(btn =>
    btn.addEventListener('click', e => { e.stopPropagation(); openSetlistDetail(btn.dataset.id); }));
  container.querySelectorAll('.btn-show-setlist').forEach(btn =>
    btn.addEventListener('click', e => { e.stopPropagation(); startShow(btn.dataset.id); }));
  container.querySelectorAll('.btn-del-setlist').forEach(btn =>
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm('¿Eliminar este setlist?')) return;
      await SetlistStore.deleteSetlist(btn.dataset.id);
      renderSetlists();
    }));
}

/* Nuevo setlist */
$('btn-new-setlist').addEventListener('click', () => {
  editingSetlistId = null;
  $('form-setlist-title').textContent = 'Nuevo setlist';
  $('sl-name').value = '';
  setPillActive($('sl-project-pills'), '');
  $('form-setlist').classList.add('open');
  $('sl-name').focus();
});

$('btn-cancel-setlist').addEventListener('click', () => $('form-setlist').classList.remove('open'));

$('btn-save-setlist').addEventListener('click', async () => {
  const name = $('sl-name').value.trim();
  if (!name) { $('sl-name').focus(); return; }
  const tag = $('sl-project-pills').querySelector('.active')?.dataset.val || null;
  await SetlistStore.saveSetlist({
    id: editingSetlistId || generateId(),
    name,
    projectTag: tag || null,
    songIds: editingSetlistId
      ? (await SetlistStore.getSetlist(editingSetlistId))?.songIds || []
      : [],
  });
  $('form-setlist').classList.remove('open');
  editingSetlistId = null;
  renderSetlists();
});

/* ── Detalle de setlist ──────────────────────────────────── */
async function openSetlistDetail(id) {
  currentSetlistId = id;
  const sl       = await SetlistStore.getSetlist(id);
  const allSongs = await SetlistStore.getAllSongs();
  showView('detail');

  $('detail-title').textContent = sl.name;

  // Canciones en el setlist
  const detailList = $('detail-songs-list');
  if (!sl.songIds?.length) {
    detailList.innerHTML = '<p class="empty-state" style="padding:24px 0">Sin canciones todavía.</p>';
  } else {
    detailList.innerHTML = sl.songIds.map((sid, i) => {
      const s = allSongs.find(x => x.id === sid);
      if (!s) return '';
      return `
        <div class="song-row">
          <span class="song-row__num">${String(i+1).padStart(2,'0')}</span>
          <div class="song-row__info">
            <div class="song-row__title">${s.title}</div>
            <div class="song-row__meta">${[s.key, s.tempo ? s.tempo+' BPM' : null, s.duration ? formatTime(s.duration) : null].filter(Boolean).join(' · ')}</div>
          </div>
          <button class="song-row__remove" data-sid="${sid}" title="Quitar">×</button>
        </div>`;
    }).join('');

    detailList.querySelectorAll('.song-row__remove').forEach(btn =>
      btn.addEventListener('click', async () => {
        const updated = sl.songIds.filter(x => x !== btn.dataset.sid);
        await SetlistStore.saveSetlist({ ...sl, songIds: updated });
        openSetlistDetail(id);
      }));
  }

  // Canciones que se pueden agregar
  const notIn = allSongs.filter(s => !sl.songIds?.includes(s.id));
  const addDiv = $('detail-add-songs');
  if (!notIn.length) {
    addDiv.innerHTML = '<p class="empty-state" style="padding:16px 0;font-size:13px">Todas las canciones ya están en el setlist.</p>';
  } else {
    addDiv.innerHTML = notIn.map(s => `
      <div class="song-row">
        <div class="song-row__info">
          <div class="song-row__title">${s.title}</div>
          <div class="song-row__meta">${s.artist || ''}</div>
        </div>
        <button class="action-btn btn-add-song-to-sl" data-sid="${s.id}">+ Agregar</button>
      </div>`).join('');

    addDiv.querySelectorAll('.btn-add-song-to-sl').forEach(btn =>
      btn.addEventListener('click', async () => {
        const fresh = await SetlistStore.getSetlist(id);
        await SetlistStore.saveSetlist({ ...fresh, songIds: [...(fresh.songIds||[]), btn.dataset.sid] });
        openSetlistDetail(id);
      }));
  }
}

$('btn-back-setlists').addEventListener('click', () => { showView('setlists'); renderSetlists(); });
$('btn-start-show').addEventListener('click', () => startShow(currentSetlistId));

/* ══ CANCIONES ══════════════════════════════════════════════ */

async function renderSongs() {
  const songs = await SetlistStore.getAllSongs();
  const container = $('songs-list');

  if (!songs.length) {
    container.innerHTML = '<p class="empty-state">No hay canciones todavía.</p>';
    return;
  }

  container.innerHTML = songs.map(s => {
    const meta = [s.artist, s.key, s.tempo ? s.tempo+' BPM' : null, s.duration ? formatTime(s.duration) : null]
      .filter(Boolean).join(' · ');
    return `
      <div class="item-card">
        <div class="item-card__title">${s.title}</div>
        <div class="item-card__meta">${meta}</div>
        <div class="item-card__actions">
          <button class="action-btn btn-edit-song" data-id="${s.id}">Editar</button>
          <button class="action-btn action-btn--danger btn-del-song" data-id="${s.id}">Eliminar</button>
        </div>
      </div>`;
  }).join('');

  container.querySelectorAll('.btn-edit-song').forEach(btn =>
    btn.addEventListener('click', () => openSongForm(btn.dataset.id)));
  container.querySelectorAll('.btn-del-song').forEach(btn =>
    btn.addEventListener('click', async () => {
      if (!confirm('¿Eliminar esta canción?')) return;
      await SetlistStore.deleteSong(btn.dataset.id);
      renderSongs();
    }));
}

/* Form canción */
$('btn-new-song').addEventListener('click', () => openSongForm(null));
$('btn-cancel-song').addEventListener('click', () => $('form-song').classList.remove('open'));

async function openSongForm(id) {
  editingSongId = id;
  structureSections = [];
  $('form-song-title').textContent = id ? 'Editar canción' : 'Nueva canción';
  tapTimes = [];

  if (id) {
    const s = await SetlistStore.getSong(id);
    $('s-title').value   = s.title || '';
    $('s-artist').value  = s.artist || '';
    $('s-key').value     = s.key || '';
    $('s-timesig').value = s.timeSignature || '';
    $('s-tempo').value   = s.tempo || '';
    $('s-notes').value   = s.notes || '';
    $('s-link').value    = s.link || '';
    structureSections    = [...(s.structure || [])];
    setPillActive($('s-project-pills'), s.projectTag || '');
  } else {
    ['s-title','s-artist','s-key','s-timesig','s-tempo','s-notes','s-link'].forEach(id => $(id).value = '');
    setPillActive($('s-project-pills'), '');
  }

  renderStructure();
  $('form-song').classList.add('open');
  $('s-title').focus();
}

function renderStructure() {
  const list = $('structure-list');
  list.innerHTML = structureSections.map((sec, i) => `
    <div class="structure-item">
      <input class="field-input" placeholder="Nombre" value="${sec.name}" data-i="${i}" data-field="name">
      <input class="field-input dur" placeholder="s" type="number" value="${sec.duration || ''}" data-i="${i}" data-field="duration" min="0">
      <button class="remove-btn" data-i="${i}">×</button>
    </div>`).join('');

  list.querySelectorAll('input').forEach(inp =>
    inp.addEventListener('change', e => {
      const i = +e.target.dataset.i;
      const f = e.target.dataset.field;
      structureSections[i][f] = f === 'duration' ? +e.target.value : e.target.value;
    }));
  list.querySelectorAll('.remove-btn').forEach(btn =>
    btn.addEventListener('click', () => {
      structureSections.splice(+btn.dataset.i, 1);
      renderStructure();
    }));
}

$('btn-add-section').addEventListener('click', () => {
  structureSections.push({ name: '', duration: 0 });
  renderStructure();
});

$('btn-save-song').addEventListener('click', async () => {
  const title = $('s-title').value.trim();
  if (!title) { $('s-title').focus(); return; }

  const totalDur = structureSections.reduce((a, s) => a + (s.duration || 0), 0);
  const tag      = $('s-project-pills').querySelector('.active')?.dataset.val || null;

  await SetlistStore.saveSong({
    id:            editingSongId || generateId(),
    title,
    artist:        $('s-artist').value.trim(),
    key:           $('s-key').value.trim(),
    timeSignature: $('s-timesig').value.trim(),
    tempo:         +$('s-tempo').value || null,
    duration:      totalDur,
    structure:     structureSections,
    notes:         $('s-notes').value.trim(),
    projectTag:    tag || null,
    link:          $('s-link').value.trim() || null,
  });

  $('form-song').classList.remove('open');
  editingSongId = null;
  renderSongs();
});

/* Tap tempo */
$('tap-btn').addEventListener('click', () => {
  const now = performance.now();
  tapTimes.push(now);
  if (tapTimes.length > 8) tapTimes.shift();

  // Reset si pausa > 2s
  if (tapTimes.length >= 2 && (now - tapTimes[tapTimes.length - 2]) > 2000) {
    tapTimes = [now];
    return;
  }

  if (tapTimes.length >= 3) {
    const intervals = [];
    for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i-1]);
    const avg = intervals.reduce((a,b) => a+b) / intervals.length;
    $('s-tempo').value = Math.round(60000 / avg);
  }
});

/* ══ PROJECT PILLS (helper) ═════════════════════════════════ */
function setPillActive(container, val) {
  container.querySelectorAll('.project-pill-form').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.val === val);
  });
}

document.querySelectorAll('.project-pills-form').forEach(container => {
  container.addEventListener('click', e => {
    const btn = e.target.closest('.project-pill-form');
    if (!btn) return;
    setPillActive(container, btn.dataset.val);
  });
});

/* ══ MODO SHOW ═══════════════════════════════════════════════ */
async function startShow(setlistId) {
  const sl       = await SetlistStore.getSetlist(setlistId);
  if (!sl?.songIds?.length) { alert('El setlist no tiene canciones.'); return; }
  const allSongs = await SetlistStore.getAllSongs();
  showSongs      = sl.songIds.map(id => allSongs.find(s => s.id === id)).filter(Boolean);
  showIdx        = 0;
  renderShowSong();
  $('show-mode').classList.add('open');
  requestWakeLock();
}

function renderShowSong() {
  const s   = showSongs[showIdx];
  const tot = showSongs.length;

  $('show-counter').textContent = `Setlist · ${String(showIdx+1).padStart(2,'0')} / ${String(tot).padStart(2,'0')}`;
  $('show-title').textContent   = s.title;
  $('show-artist').textContent  = s.artist ? `— ${s.artist}` : '';

  // Meta
  $('show-meta').innerHTML = `
    <span class="show-meta-key">${s.key || '·'}</span>
    ${s.tempo ? `<span class="show-meta-label">Tempo</span><span class="show-meta-value">${s.tempo} BPM</span>` : ''}
    ${s.timeSignature ? `<span class="show-meta-label">Compás</span><span class="show-meta-value">${s.timeSignature}</span>` : ''}
    ${s.duration ? `<span class="show-meta-label">Duración</span><span class="show-meta-value">${formatTime(s.duration)}</span>` : ''}
  `;

  // Estructura
  const struct = $('show-structure');
  if (s.structure?.length) {
    struct.innerHTML = s.structure.map(sec =>
      `<div class="show-structure-item">
        <span>${sec.name}</span>
        <span>${sec.duration ? formatTime(sec.duration) : ''}</span>
      </div>`).join('');
  } else {
    struct.innerHTML = '<p style="color:var(--color-text-faint);font-family:var(--font-mono);font-size:11px;padding:8px 0">Sin estructura definida.</p>';
  }

  // Notas
  $('show-notes').innerHTML = s.notes ? parseAccentText(s.notes) : '';

  // Nav
  $('btn-prev').disabled = showIdx === 0;
  $('btn-next').disabled = showIdx === showSongs.length - 1;
}

$('btn-prev').addEventListener('click', () => { if (showIdx > 0) { showIdx--; renderShowSong(); } });
$('btn-next').addEventListener('click', () => { if (showIdx < showSongs.length-1) { showIdx++; renderShowSong(); } });

// Tap zonas laterales
$('show-mode').addEventListener('click', e => {
  const w = window.innerWidth;
  if (e.target.closest('button')) return;
  if (e.clientX < w * 0.35) { if (showIdx > 0) { showIdx--; renderShowSong(); } }
  else if (e.clientX > w * 0.65) { if (showIdx < showSongs.length-1) { showIdx++; renderShowSong(); } }
});

// Swipe
let touchStartX = 0;
$('show-mode').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
$('show-mode').addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) < 50) return;
  if (diff > 0 && showIdx < showSongs.length-1) { showIdx++; renderShowSong(); }
  if (diff < 0 && showIdx > 0) { showIdx--; renderShowSong(); }
});

// Teclado
document.addEventListener('keydown', e => {
  if (!$('show-mode').classList.contains('open')) return;
  if (e.key === 'ArrowRight' && showIdx < showSongs.length-1) { showIdx++; renderShowSong(); }
  if (e.key === 'ArrowLeft'  && showIdx > 0) { showIdx--; renderShowSong(); }
  if (e.key === 'Escape') exitShow();
});

$('btn-exit-show').addEventListener('click', exitShow);

function exitShow() {
  $('show-mode').classList.remove('open');
  releaseWakeLock();
}

/* Wake Lock */
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
async function releaseWakeLock() {
  if (wakeLock) { await wakeLock.release(); wakeLock = null; }
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && $('show-mode').classList.contains('open')) {
    requestWakeLock();
  }
});

/* ══ IMPORT / EXPORT ═════════════════════════════════════════ */
$('btn-export').addEventListener('click', async () => {
  const data = await SetlistStore.exportAll();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), {
    href: url,
    download: `jorge-malgesto-setlists-${new Date().toISOString().slice(0,10)}.json`
  });
  a.click();
  URL.revokeObjectURL(url);
});

$('btn-import').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const mode = confirm('¿Reemplazar todo? (Cancelar = agregar a lo existente)') ? 'replace' : 'merge';
    await SetlistStore.importAll(data, { mode });
    renderSetlists();
    alert('Importado correctamente.');
  } catch {
    alert('El archivo no es válido.');
  }
  e.target.value = '';
});

/* ── Carga inicial ───────────────────────────────────────── */
renderSetlists();
</script>
